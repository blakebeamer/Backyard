<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Backyard Plan Render</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: plan-review tool. Fixed layer panel on the left, the rendered site plan fills the rest. Phone: plan on top, panel below. */
:root{
  --bg:#eceae4; --panel:#ffffff; --panel-2:#f6f5f2; --line:#e6e3dc;
  --fg:#2b2925; --muted:#8f8a80; --faint:#b2ada3;
  --accent:#2f6f4f; --accent-soft:#e7f1eb; --chip:#faf9f7;
  --tip-bg:rgba(30,28,25,.94); --tip-fg:#ffffff;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151714; --panel:#1d201c; --panel-2:#242823; --line:#30352f;
  --fg:#e7e5de; --muted:#a19d93; --faint:#6f6c65;
  --accent:#78c79a; --accent-soft:#233a2d; --chip:#262a25;
  --tip-bg:rgba(245,244,240,.96); --tip-fg:#1d1c19; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151714; --panel:#1d201c; --panel-2:#242823; --line:#30352f;
  --fg:#e7e5de; --muted:#a19d93; --faint:#6f6c65;
  --accent:#78c79a; --accent-soft:#233a2d; --chip:#262a25;
  --tip-bg:rgba(245,244,240,.96); --tip-fg:#1d1c19; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden}
#app{display:flex;height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#panel{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pn-head{padding:18px 18px 6px}
.pn-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.pn-sub{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.progress{height:3px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.pn-actions{display:flex;gap:6px;padding:10px 18px 6px}
.pn-chip{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:7px;padding:7px 0;font:600 12px var(--font-ui);cursor:pointer}
.pn-chip:hover{background:var(--panel-2)}
.pn-chip:focus-visible,.grp-btn:focus-visible,.row:focus-within,.zc button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#toggle-list{padding:4px 10px 8px;overflow-y:auto;flex:1;min-height:0}
.grp{margin-top:8px}
.grp-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.grp-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grp-btn{border:none;background:none;font:600 11px var(--font-ui);color:var(--accent);cursor:pointer;padding:2px 5px;border-radius:4px}
.grp-btn:hover{background:var(--accent-soft)}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
.row:hover{background:var(--panel-2)}
.sw{width:16px;height:16px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);background-size:cover}
.txt{flex:1;min-width:0}
.nm{font-size:13.5px;line-height:1.25}
.meta{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.row.off .nm{color:var(--faint)} .row.off .sw{opacity:.35}
.eye{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--accent)}
.row.off .eye{color:var(--faint)}
.eye svg{width:17px;height:17px}
.row input{position:absolute;opacity:0;pointer-events:none}
.pn-foot{font-size:11.5px;line-height:1.45;color:var(--muted);padding:10px 18px 16px;border-top:1px solid var(--line)}
.pn-foot b{color:var(--fg);font-weight:600}
#wrap{position:relative;flex:1;overflow:hidden;touch-action:none;background:var(--bg);cursor:grab;min-width:0}
#wrap.panning{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;box-shadow:0 2px 14px rgba(0,0,0,.18)}
#stage canvas,#stage svg{position:absolute;display:block}
#stage .lyr[data-off="1"]{display:none}
#overlay{pointer-events:none}
.zc{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 5px rgba(0,0,0,.14);padding:4px;z-index:5}
.zc button{width:30px;height:30px;border:none;background:var(--panel-2);color:var(--fg);border-radius:6px;font:600 16px var(--font-ui);cursor:pointer;display:flex;align-items:center;justify-content:center}
.zc button:hover{filter:brightness(.96)}
.zc button:disabled{opacity:.4;cursor:default}
.zc .lvl{font:12px var(--font-num);color:var(--muted);min-width:44px;text-align:center}
.zc .fit{width:auto;padding:0 9px;font-size:11px}
.scalebar{position:absolute;left:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px 7px;z-index:5;font:11px var(--font-num);color:var(--muted)}
.scalebar .bar{height:6px;margin-top:4px;border:1.5px solid var(--fg);border-top:none;display:flex}
.scalebar .bar i{flex:1;border-right:1.5px solid var(--fg)} .scalebar .bar i:last-child{border-right:none}
#tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;line-height:1.4;padding:6px 10px;border-radius:6px;z-index:20;opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s;max-width:240px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font-weight:650}
#tip span{opacity:.75}
@media (max-width:720px){
  #app{flex-direction:column-reverse}
  #panel{width:auto;height:42%;border-right:none;border-top:1px solid var(--line)}
  .pn-foot{display:none}
  .pn-head,.pn-actions{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.progress i,#tip{transition:none}}
</style>

<div id="app">
  <aside id="panel" aria-label="Plan layers">
    <div class="pn-head">
      <div class="pn-title">Backyard Plan</div>
      <div class="pn-sub" id="pn-sub">Rendering materials…</div>
      <div class="progress" id="prog"><i></i></div>
    </div>
    <div class="pn-actions">
      <button type="button" class="pn-chip" id="show-all">Show all</button>
      <button type="button" class="pn-chip" id="base-only">Base only</button>
    </div>
    <div id="toggle-list"></div>
    <div class="pn-foot" id="foot">Drawn to the plan's scale, <b>1 ft ≈ 14.35 plan units</b>. Shadows assume a late-morning sun from the upper left until north is confirmed.</div>
  </aside>
  <main id="wrap" aria-label="Rendered backyard plan">
    <div id="stage"></div>
    <div class="scalebar" aria-hidden="true"><span id="sb-label">10 ft</span><div class="bar" id="sb-bar"><i></i><i></i></div></div>
    <div class="zc">
      <button type="button" id="z-out" aria-label="Zoom out">&minus;</button>
      <span class="lvl" id="z-lvl">100%</span>
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-fit" class="fit">Fit</button>
    </div>
  </main>
</div>
<div id="tip"></div>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;};
function hex(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,f,a){const c=Array.isArray(h)?h:hex(h);const m=v=>Math.max(0,Math.min(255,Math.round(f>=0?v+(255-v)*f:v*(1+f))));return a==null?`rgb(${m(c[0])},${m(c[1])},${m(c[2])})`:`rgba(${m(c[0])},${m(c[1])},${m(c[2])},${a})`;}
function poly(ctx,pts,close=true){ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();}
function area(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}

function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}return [x0,y0,x1,y1];}
function dedupe(pts){const o=[];for(const p of pts){const l=o[o.length-1];if(!l||Math.hypot(l[0]-p[0],l[1]-p[1])>0.05)o.push(p);}const f=o[0],l=o[o.length-1];if(o.length>2&&Math.hypot(f[0]-l[0],f[1]-l[1])<0.05)o.pop();return o;}
function inset(pts,d){ // convex polygon inset
  pts=orient(dedupe(pts));const n=pts.length,L=[];
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];let dx=q[0]-p[0],dy=q[1]-p[1];const l=Math.hypot(dx,dy);dx/=l;dy/=l;const nx=-dy,ny=dx;L.push([p[0]+nx*d,p[1]+ny*d,dx,dy]);}
  const out=[];for(let i=0;i<n;i++){const a=L[(i+n-1)%n],b=L[i];const den=a[2]*b[3]-a[3]*b[2];if(Math.abs(den)<1e-6){out.push([b[0],b[1]]);continue;}const t=((b[0]-a[0])*b[3]-(b[1]-a[1])*b[2])/den;out.push([a[0]+a[2]*t,a[1]+a[3]*t]);}
  return out;

function centroid(pts){let x=0,y=0;for(const p of pts){x+=p[0];y+=p[1];}return [x/pts.length,y/pts.length];}

/* soft shadow / glow via canvas shadow, independent of the current transform */
function soft(ctx,S,build,color,blur,dx,dy,rule){
  const F=30000;ctx.save();ctx.shadowColor=color;ctx.shadowBlur=Math.max(0.01,blur*S);
  const m=ctx.getTransform();ctx.shadowOffsetX=(dx*S)-F*m.a;ctx.shadowOffsetY=(dy*S);

const TEX={};
function noiseCanvas(n,cells,seed,oct){
  const c=mk(n,n),x=c.getContext('2d'),id=x.createImageData(n,n),R=rng(seed);
  const layers=[];for(let o=0;o<oct;o++){const g=cells<<o,arr=new Float32Array(g*g);for(let i=0;i<arr.length;i++)arr[i]=R();layers.push([g,arr]);}
  const sm=t=>t*t*(3-2*t);
  for(let py=0;py<n;py++)for(let px=0;px<n;px++){let v=0,amp=1,tot=0;
    for(const [g,arr] of layers){const fx=px/n*g,fy=py/n*g,ix=Math.floor(fx),iy=Math.floor(fy),tx=sm(fx-ix),ty=sm(fy-iy);
      const a=arr[(iy%g)*g+ix%g],b=arr[(iy%g)*g+(ix+1)%g],cc=arr[((iy+1)%g)*g+ix%g],d=arr[((iy+1)%g)*g+(ix+1)%g];
      v+=amp*((a*(1-tx)+b*tx)*(1-ty)+(cc*(1-tx)+d*tx)*ty);tot+=amp;amp*=0.5;}
    v/=tot;const k=(py*n+px)*4,g8=v*255;id.data[k]=id.data[k+1]=id.data[k+2]=g8;id.data[k+3]=255;}
  x.putImageData(id,0,0);return c;
}
function speckle(n,seed,dark,light){
  const c=mk(n,n),x=c.getContext('2d'),id=x.createImageData(n,n),R=rng(seed);
  for(let i=0;i<n*n;i++){const v=R(),k=i*4;if(v<0.5){id.data[k+3]=(0.5-v)*dark*510;}else{id.data[k]=id.data[k+1]=id.data[k+2]=255;id.data[k+3]=(v-0.5)*light*510;}}

function voronoi(n,cells,seed,mode){
  const c=mk(n,n),x=c.getContext('2d'),id=x.createImageData(n,n),R=rng(seed),pts=[],cs=n/cells;

    const ci=Math.floor(px/cs),cj=Math.floor(py/cs);let d1=1e9,d2=1e9,v=0;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=(ci+di+cells)%cells,jj=(cj+dj+cells)%cells,p=pts[jj*cells+ii];
      const qx=p[0]+(ci+di-ii)*cs,qy=p[1]+(cj+dj-jj)*cs,d=Math.hypot(px-qx,py-qy);if(d<d1){d2=d1;d1=d;v=p[2];}else if(d<d2)d2=d;}

    else{const g=150+v*55+(Math.random()-0.5)*6;id.data[k]=g-3;id.data[k+1]=g;id.data[k+2]=g+5;id.data[k+3]=255;}}

function strokesTile(n,seed,base,count,genFn,buckets){
  const c=mk(n,n),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,n,n);x.lineCap='round';

  const keys=[...paths.keys()];for(let r=0;r<keys.length;r++){const j=Math.floor(R()*keys.length);[keys[r],keys[j]]=[keys[j],keys[r]];}
  for(const k of keys){const p=paths.get(k);x.strokeStyle=p.color;x.lineWidth=p.w;x.beginPath();

  {key:'pavers',name:'Paver Pads',meta:'20 in concrete steppers',group:'Hardscape',draw:pavers,box:()=>bboxAll(D.pavers.map(b=>[[b[0],b[1]],[b[2],b[3]]]),6),sw:'#c2beb5',tip:'Concrete stepper · 20 in square'},
  {key:'walls',name:'Block Ledges',meta:'Walkway + level change',group:'Hardscape',draw:walls,box:()=>bboxAll(D.walls.map(b=>[[b[0],b[1]],[b[2],b[3]]]),8),sw:'#a29e95',tip:'Block ledge · tumbled concrete wall block'},
  {key:'brickpavers',name:'Brick Paver Pad',meta:'20 × 12 ft · herringbone',group:'Hardscape',draw:brickPad,box:()=>[1050,1145,1352,1446],sw:'#b5624a',tip:'Brick paver pad · 20 × 12 ft, 45° herringbone with soldier border'},
  {key:'turf',name:'Artificial Turf',meta:'20 × 10 ft · lower level',group:'Lawn + Structures',draw:turf,box:()=>[1050,1488,1358,1655],sw:'#4c6b32',tip:'Artificial turf · 20 × 10 ft'},
  {key:'poolpump',name:'Pool Pump',meta:'Filter pump + hoses',group:'Pool',draw:pump,box:()=>[1268,1332,1345,1390],sw:'#7d828a',tip:'Filter pump + hoses'},
  {key:'pool',name:'Stock Tank Pool',meta:'10 ft round · galvanized',group:'Pool',draw:pool,box:()=>[1140,1270,1310,1440],sw:'#4ea5b3',tip:'Stock tank pool · 10 ft galvanized'},
  {key:'shed',name:'Shed',meta:'On the turf',group:'Lawn + Structures',draw:shed,box:()=>[1280,1498,1380,1660],sw:'#b3ada3',tip:'Storage shed · ~3.6 × 6.8 ft'},
  {key:'furniture',name:'Furniture',meta:'Loungers, chairs, tables',group:'Furnishings',draw:furniture,box:()=>[1070,1155,1340,1310],sw:'#e9e2d6',tip:'Lounge furniture'},
  {key:'boulders',name:'Boulders',meta:'Rock clusters',group:'Furnishings',draw:boulders,box:()=>[1130,1405,1300,1455],sw:'#b9ab9a',tip:'Boulder cluster'},
  {key:'planters',name:'Planter Pots',meta:'Terracotta + plants',group:'Furnishings',draw:planters,box:()=>[1068,1155,1345,1438],sw:'#c27b52',tip:'Terracotta planter'},
  {key:'umbrella',name:'Big Umbrella',meta:'10 ft cantilever',group:'Furnishings',draw:umbrella,box:()=>[1035,1250,1300,1510],sw:'#e5bba9',tip:'10 ft cantilever umbrella'},
  {key:'electrical',name:'Electrical',meta:'Buried line + shed subpanel',group:'Utilities + Overlays',draw:electricalBox,box:()=>[1318,1490,1365,1525],sw:'#e5484d',tip:'Shed subpanel on a post'},
  {key:'dimensions',name:'Dimensions',meta:'Measurement overlay',group:'Utilities + Overlays',draw:null,box:null,sw:'#1d4ed8',tip:''}
];
function bboxAll(list,m){let b=[1e9,1e9,-1e9,-1e9];for(const pts of list){const q=bbox(pts);b=[Math.min(b[0],q[0]),Math.min(b[1],q[1]),Math.max(b[2],q[2]),Math.max(b[3],q[3])];}return [b[0]-m,b[1]-m,b[2]+m,b[3]+m];}
const GROUPS=['Pool','Hardscape','Lawn + Structures','Furnishings','Utilities + Overlays'];
const BASE_ONLY=['pool','poolpump','brickpavers','pavers','walls','turf'];
const DEFAULT_OFF=['dimensions','electrical'];

/* ---------- stage ---------- */
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
stage.style.width=VB.w+'px';stage.style.height=VB.h+'px';
function placeCanvas(x,y,w,h,S,cls,key){const c=mk(w*S,h*S);c.style.left=(x-VB.x)+'px';c.style.top=(y-VB.y)+'px';c.style.width=w+'px';c.style.height=h+'px';if(cls)c.className=cls;if(key)c.dataset.layer=key;const ovEl=document.getElementById('overlay');ovEl?stage.insertBefore(c,ovEl):stage.appendChild(c);const ctx=c.getContext('2d');ctx.setTransform(S,0,0,S,-x*S,-y*S);ctx.imageSmoothingQuality='high';return {c,ctx};}

/* overlay: electrical run + dimensions (crisp vector) */
const NS='http://www.w3.org/2000/svg';
const ov=document.createElementNS(NS,'svg');ov.id='overlay';ov.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);ov.style.left='0';ov.style.top='0';ov.style.width=VB.w+'px';ov.style.height=VB.h+'px';
ov.innerHTML=`<g class="lyr" data-layer="electrical">
 <path d="M1304.5 527L1304.5 929.5L1337 988L1337 1497" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M1304.5 527L1304.5 929.5L1337 988L1337 1497" fill="none" stroke="#e5484d" stroke-width="2.6" stroke-dasharray="7 4" stroke-linecap="round" stroke-linejoin="round"/>
 ${[[1305,524,'Main panel'],[1306,930,'Exterior outlet'],[1336,1293,'Pool outlet'],[1337,1526,'Subpanel']].map(p=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="7.5" fill="#e5484d" stroke="#fff" stroke-width="2.2"/><circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#fff"/></g>`).join('')}
</g><g class="toggle-layer" data-layer="dimensions" data-label="Dimensions"><line x1="1057.0" y1="1129.0" x2="1344.0" y2="1129.0" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1057.0" y1="1124.0" x2="1057.0" y2="1134.0" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1344.0" y1="1124.0" x2="1344.0" y2="1134.0" stroke="#1d4ed8" stroke-width="1.5"/><rect x="1175.5" y="1121.0" width="50" height="16" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/><text x="1200.5" y="1133.0" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="600" fill="#1d4ed8" text-anchor="middle">20'</text><line x1="1046.0" y1="1151.0" x2="1046.0" y2="1319.0" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1041.0" y1="1151.0" x2="1051.0" y2="1151.0" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1041.0" y1="1319.0" x2="1051.0" y2="1319.0" stroke="#1d4ed8" stroke-width="1.5"/><rect x="1031.5" y="1227.0" width="29" height="16" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/><text x="1046.0" y="1239.0" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="600" fill="#1d4ed8" text-anchor="middle">12'</text><line x1="1146.4" y1="1446.5" x2="1291.4" y2="1446.5" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1146.4" y1="1441.5" x2="1146.4" y2="1451.5" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1291.4" y1="1441.5" x2="1291.4" y2="1451.5" stroke="#1d4ed8" stroke-width="1.5"/><rect x="1176.4" y="1438.5" width="85" height="16" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/><text x="1218.9" y="1450.5" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="600" fill="#1d4ed8" text-anchor="middle">10' pool</text><line x1="1055.0" y1="1570.5" x2="1352.0" y2="1570.5" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1055.0" y1="1565.5" x2="1055.0" y2="1575.5" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1352.0" y1="1565.5" x2="1352.0" y2="1575.5" stroke="#1d4ed8" stroke-width="1.5"/><rect x="1161.0" y="1562.5" width="85" height="16" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/><text x="1203.5" y="1574.5" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="600" fill="#1d4ed8" text-anchor="middle">20' turf</text><line x1="1095.0" y1="1492.0" x2="1095.0" y2="1649.0" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1090.0" y1="1492.0" x2="1100.0" y2="1492.0" stroke="#1d4ed8" stroke-width="1.5"/><line x1="1090.0" y1="1649.0" x2="1100.0" y2="1649.0" stroke="#1d4ed8" stroke-width="1.5"/><rect x="1070.0" y="1562.5" width="50" height="16" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/><text x="1095.0" y="1574.5" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="600" fill="#1d4ed8" text-anchor="middle">10'</text></g>`;
stage.appendChild(ov);
const dimG=ov.querySelector('[data-layer="dimensions"]');dimG.setAttribute('class','lyr');
dimG.querySelectorAll('line').forEach(l=>{const c=l.cloneNode();c.setAttribute('stroke','rgba(255,255,255,.9)');c.setAttribute('stroke-width','4');l.before(c);l.setAttribute('stroke-width','1.6');});
dimG.querySelectorAll('rect').forEach(r=>{r.setAttribute('rx','5');r.setAttribute('fill','rgba(255,255,255,.94)');});

/* ---------- state ---------- */
const KEY='backyard_photoreal_v1';
let vis={};LAYERS.forEach(l=>vis[l.key]=DEFAULT_OFF.indexOf(l.key)===-1);
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.vis)Object.assign(vis,s.vis);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({vis}));}catch(e){}}
function applyVis(){stage.querySelectorAll('.lyr').forEach(el=>{el.dataset.off=vis[el.dataset.layer]?'0':'1';});renderList();}

/* ---------- panel ---------- */
const EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';
const list=document.getElementById('toggle-list'),sub=document.getElementById('pn-sub');
let rendered=false;
function renderList(){
  list.innerHTML='';
  GROUPS.forEach(gn=>{const ls=LAYERS.filter(l=>l.group===gn);if(!ls.length)return;const anyOn=ls.some(l=>vis[l.key]);
    const g=document.createElement('div');g.className='grp';
    g.innerHTML=`<div class="grp-head"><span class="grp-name">${gn}</span><button type="button" class="grp-btn" data-keys="${ls.map(l=>l.key).join(',')}" data-to="${anyOn?0:1}">${anyOn?'Hide':'Show'}</button></div>`;
    ls.forEach(l=>{const on=!!vis[l.key];const row=document.createElement('label');row.className='row'+(on?'':' off');
      row.innerHTML=`<span class="sw" style="background:${l.sw}"></span><span class="txt"><div class="nm">${l.name}</div><div class="meta">${l.meta}</div></span><span class="eye">${on?EYE_ON:EYE_OFF}</span><input type="checkbox" id="tg-${l.key}" data-key="${l.key}"${on?' checked':''}>`;
      g.appendChild(row);});
    list.appendChild(g);});
  if(rendered){const on=LAYERS.filter(l=>vis[l.key]).length;sub.textContent=`${on} of ${LAYERS.length} layers visible`;}
}
list.addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;vis[k]=e.target.checked;applyVis();save();});
list.addEventListener('click',e=>{const b=e.target.closest('.grp-btn');if(!b)return;const to=b.dataset.to==='1';b.dataset.keys.split(',').forEach(k=>vis[k]=to);applyVis();save();});
document.getElementById('show-all').onclick=()=>{LAYERS.forEach(l=>vis[l.key]=true);applyVis();save();};
document.getElementById('base-only').onclick=()=>{LAYERS.forEach(l=>vis[l.key]=BASE_ONLY.indexOf(l.key)!==-1);applyVis();save();};

/* ---------- zoom / pan ---------- */
let zoom=1,panX=0,panY=0;const ZMIN=0.15,ZMAX=7;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function clampPan(){const W=wrap.clientWidth,H=wrap.clientHeight,cw=VB.w*zoom,ch=VB.h*zoom,m=80;
  panX=cw<=W?clamp(panX,0,W-cw):clamp(panX,W-cw-m,m);panY=ch<=H?clamp(panY,0,H-ch):clamp(panY,H-ch-m,m);}
const zl=document.getElementById('z-lvl'),zi=document.getElementById('z-in'),zo=document.getElementById('z-out'),sbl=document.getElementById('sb-label'),sbb=document.getElementById('sb-bar');
function apply(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;zl.textContent=Math.round(zoom*100)+'%';zi.disabled=zoom>=ZMAX-1e-3;zo.disabled=zoom<=ZMIN+1e-3;
  const pxPerFt=UFT*zoom;const opts=[1,2,5,10,20,50];let ft=opts[opts.length-1];for(const o of opts){if(o*pxPerFt>=60){ft=o;break;}}sbl.textContent=ft+' ft';sbb.style.width=(ft*pxPerFt)+'px';}
function focus(){ // fit the backyard (house roof to back fence)
  const W=wrap.clientWidth,H=wrap.clientHeight;const r={x:470,y:880,w:950,h:820};const p=20;
  zoom=clamp(Math.min((W-p*2)/r.w,(H-p*2)/r.h),ZMIN,ZMAX);panX=(W-r.w*zoom)/2-(r.x-VB.x)*zoom;panY=(H-r.h*zoom)/2-(r.y-VB.y)*zoom;clampPan();apply();}
function zoomAt(nz,clX,clY){const rc=wrap.getBoundingClientRect(),px=clX-rc.left,py=clY-rc.top;nz=clamp(nz,ZMIN,ZMAX);if(nz===zoom)return;const cx=(px-panX)/zoom,cy=(py-panY)/zoom;zoom=nz;panX=px-cx*nz;panY=py-cy*nz;clampPan();apply();}
const zc=f=>{const rc=wrap.getBoundingClientRect();zoomAt(zoom*f,rc.left+rc.width/2,rc.top+rc.height/2);};
zi.onclick=()=>zc(1.3);zo.onclick=()=>zc(1/1.3);document.getElementById('z-fit').onclick=focus;
wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(zoom*Math.exp(-e.deltaY*0.0022),e.clientX,e.clientY);},{passive:false});
wrap.addEventListener('dblclick',e=>zoomAt(zoom*1.6,e.clientX,e.clientY));
const ptrs={};let pinch=null,pan=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.zc'))return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};wrap.setPointerCapture(e.pointerId);const ids=Object.keys(ptrs);
  if(ids.length===2){const a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom};pan=null;}else{pan={x:e.clientX,y:e.clientY,px:panX,py:panY};wrap.classList.add('panning');}hideTip();});
wrap.addEventListener('pointermove',e=>{if(!(e.pointerId in ptrs)){hover(e);return;}ptrs[e.pointerId]={x:e.clientX,y:e.clientY};const ids=Object.keys(ptrs);
  if(ids.length===2&&pinch){const a=ptrs[ids[0]],b=ptrs[ids[1]];zoomAt(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);}
  else if(pan){panX=pan.px+e.clientX-pan.x;panY=pan.py+e.clientY-pan.y;clampPan();apply();}});
const up=e=>{delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;if(!Object.keys(ptrs).length){pan=null;wrap.classList.remove('panning');}};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);wrap.addEventListener('pointerleave',hideTip);
window.addEventListener('resize',()=>{clampPan();apply();});

/* ---------- hover info ---------- */
const tip=document.getElementById('tip');let tipT=null,tipKey='';
const ZONES=[
  {name:'Covered patio',d:'Standing-seam roof, drains to the river rock band',pts:D.patio},
  {name:'House roof',d:'Asphalt shingle',pts:D.roofB},{name:'House roof',d:'Asphalt shingle',pts:D.roofA},
  {name:'River rock band',d:'Mixed 1 to 4 in river rock, takes patio roof runoff',pts:BAND1},
  {name:'River rock band',d:'Mixed river rock along the back fence',pts:BAND2},
  {name:'White marble chips',d:'Project zone, about 24 × 40 ft',pts:D.chips},
  {name:'Deck landing',d:'Cedar boards at the gate corner',pts:D.wedge},
  {name:'Mulch bed',d:'Shredded hardwood along the house',pts:D.mulch},
  {name:'Basalt gravel',d:'Walkway and side yard, dark crushed basalt',pts:D.basalt},
  {name:'Lawn',d:'Existing turfgrass',pts:D.lot}];
ZONES.forEach(z=>{z.path=new Path2D();const p=z.path;p.moveTo(z.pts[0][0],z.pts[0][1]);z.pts.slice(1).forEach(q=>p.lineTo(q[0],q[1]));p.closePath();});
const hctx=mk(1,1).getContext('2d');
function hideTip(){clearTimeout(tipT);tip.classList.remove('on');tipKey='';}
function hover(e){if(!rendered||e.pointerType==='touch')return;const rc=wrap.getBoundingClientRect();const ux=(e.clientX-rc.left-panX)/zoom+VB.x,uy=(e.clientY-rc.top-panY)/zoom+VB.y;
  let hit=null;for(let i=LAYERS.length-1;i>=0;i--){const L=LAYERS[i];if(!L.cv||!vis[L.key])continue;const b=L.bx;if(ux<b[0]||uy<b[1]||ux>b[2]||uy>b[3])continue;
    const px=Math.floor((ux-b[0])*L.S),py=Math.floor((uy-b[1])*L.S);try{if(L.ctx.getImageData(px,py,1,1).data[3]>200){hit={name:L.name,d:L.tip||L.meta};break;}}catch(err){}}
  if(!hit)for(const z of ZONES){if(hctx.isPointInPath(z.path,ux,uy)){hit=z;break;}}
  tip.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';tip.style.top=(e.clientY+14)+'px';
  const key=hit?hit.name+hit.d:'';if(key===tipKey)return;hideTip();if(!hit)return;tipKey=key;
  tipT=setTimeout(()=>{tip.innerHTML=`<b>${hit.name}</b><span>${hit.d}</span>`;tip.classList.add('on');},350);}

/* ---------- render pipeline ---------- */
const bar=document.querySelector('#prog i');let steps=0;const TOTAL=11+LAYERS.length;
async function prog(){steps++;bar.style.width=Math.min(100,steps/TOTAL*100)+'%';await tick();}
async function run(){
  renderList();applyVis();focus();await tick();
  await loadChips();
  // context, low resolution
  TEXc=buildTextures(S_LO,1);await prog();
  const ctxC=placeCanvas(VB.x,VB.y,VB.w,VB.h,S_LO);await drawGround(ctxC.ctx,S_LO,VB,async()=>{});await prog();
  // yard, high resolution
  TEXc=buildTextures(S_HI,2);await prog();
  const yard=placeCanvas(YARD.x,YARD.y,YARD.w,YARD.h,S_HI);await drawGround(yard.ctx,S_HI,YARD,prog);
  // toggle layers, each in its own canvas
  for(const L of LAYERS){if(!L.draw){await prog();continue;}const b=L.box();const {c,ctx}=placeCanvas(b[0],b[1],b[2]-b[0],b[3]-b[1],S_HI,'lyr',L.key);
    stage.insertBefore(c,ov);L.cv=c;L.ctx=ctx;L.bx=b;L.S=S_HI;ctx._bb=b;L.draw(ctx,S_HI);castShadows(ctx,S_HI,'atop');await prog();}
  rendered=true;bar.parentNode.hidden=true;applyVis();
}
run().catch(err=>{sub.textContent='Rendering stopped: '+err.message;console.error(err);});
})();
</script>
